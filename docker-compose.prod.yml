version: "3.9"

services:
  db:
    image: postgres:15
    container_name: srci-db-prod
    environment:
      POSTGRES_DB: srci
      POSTGRES_USER: srci
      POSTGRES_PASSWORD: srci
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srci -d srci"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: srci-backend-prod
    env_file:
      - .env
    command: >
      bash -c "
      /scripts/run_migrations.sh &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    volumes:
      - ./scripts:/scripts
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://srci:srci@db:5432/srci
      PROPAGATING_DEPENDENCIES: runtime,sync_api,http,grpc
      SRCI_AUTONOMY_ENABLED: "true"
      SRCI_AUTO_RCA_ON_INGEST: "true"
      SRCI_POLL_INTERVAL_SEC: "30"
      SRCI_RCA_WORKERS: "2"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: srci-prometheus
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.2
    container_name: srci-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docs/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata_prod:
